name: Scientific model tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: scientific-model-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
