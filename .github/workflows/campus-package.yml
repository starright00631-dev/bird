name: BNBU v76 building identity, source edge reconstruction and environment connection verification
on:
  push:
    paths:
      - "campus/interface/**"
      - "campus/build_connection_profiles_v72.py"
      - "campus/test_connection_profiles_v72.py"
      - "campus/build_terrain_contours_v73.py"
      - "campus/test_terrain_contours_v73.py"
      - "campus/TERRAIN_3D_V73.md"
      - "campus/audit_connections_v74.py"
      - "campus/test_connections_v74.py"
      - "campus/connection_comparison_sources_v74.json"
      - "campus/JUNCTIONS_V74_DEEP_COMPARISON.md"
      - "campus/build_bridges_v75.py"
      - "campus/test_bridges_v75.py"
      - "campus/BRIDGE_WINDOW_COMPONENTS_V75.md"
      - "campus/audit_architecture_v76.py"
      - "campus/test_architecture_v76.py"
      - "campus/ARCHITECTURE_V76_RECOVERY.md"
      - "campus/connection_photos_v72.json"
      - "campus/PHOTO_CONNECTION_AUDIT_V72.md"
      - ".github/workflows/campus-package.yml"
  pull_request:
    paths:
      - "campus/interface/**"
      - ".github/workflows/campus-package.yml"
  workflow_dispatch:

concurrency:
  group: bnbu-v76-viewer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build fully bundled offline Three.js interface
        run: |
          npm install --prefix campus/interface --no-audit --no-fund
          npm run build --prefix campus/interface
          node --check campus/interface/dist/viewer.bundle.js
      - name: Verify v64 source and expand original complete assets
        run: |
          python campus/validate_scene.py
          python campus/unpack_assets.py
          python campus/validate_scene.py
      - name: Reproduce full v65/v66 verified geometry without source mesh changes
        run: |
          python campus/build_v65.py
          python campus/build_v66.py
          python campus/refine_waterfront_v69.py
          python -m unittest discover -s campus -p 'test_v65.py' -v
          python -m unittest discover -s campus -p 'test_v66.py' -v
          python -m unittest discover -s campus -p 'test_waterfront_v69.py' -v
      - name: Install geodetic dependency and reconstruct independent real DSM
        run: |
          python -m pip install "numpy>=1.26,<3" "pyproj>=3.6,<4" "shapely>=2,<3"
          python -m unittest discover -s campus -p 'test_terrain_v67.py' -v
          python campus/build_terrain_v67.py
          python campus/build_terrain_contours_v73.py
          python -m unittest discover -s campus -p 'test_terrain_contours_v73.py' -v
          python campus/build_lakefront_v70.py
          python -m unittest discover -s campus -p 'test_lakefront_v70.py' -v
          python campus/build_connection_v71.py
          python -m unittest discover -s campus -p 'test_connection_v71.py' -v
          python campus/build_connection_profiles_v72.py
          python -m unittest discover -s campus -p 'test_connection_profiles_v72.py' -v
          python campus/audit_connections_v74.py
          python -m unittest discover -s campus -p 'test_connections_v74.py' -v
          python campus/build_bridges_v75.py
          python -m unittest discover -s campus -p 'test_bridges_v75.py' -v
          python campus/audit_architecture_v76.py
          python -m unittest discover -s campus -p 'test_architecture_v76.py' -v
      - name: Build audited full ZIP and zero-dependency standalone HTML
        run: |
          python campus/interface/build_package.py
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          base=Path('dist/BNBU_Campus_Full_v76')
          m=json.loads((base/'manifest.json').read_text())
          assert m['mesh_count']==1379 and m['original_mesh_count']==1377 and m['GIS_feature_count']==522
          assert m['v72_optional_source_height_rail_profiles']==4 and m['v72_observed_distinct_photo_links']==16
          assert m['standalone_file_embeds_assets']
          assert m['v73_dsm_3d_interpolated_contour_segments']==3737
          assert m['v73_dsm_3d_contour_vertices']==7474
          assert m['v73_original_dsm_source_preserved'] and not m['v73_campus_geometry_edited']
          assert m['v74_pairwise_walk_road']==1540 and m['v74_raised_bridge_ground_crosschecks']==336
          assert m['v74_3d_junction_hotspots']==47 and m['v74_photo_references_total']==23
          assert m['v74_no_unregistered_physical_geometry']
          assert m['v75_bridge_system_count']==7 and m['v75_academic_bridge_endpoints']==12
          assert m['v75_source_lakebridge_railing_points']==340
          assert m['v75_illustrative_glass_mesh_quads_not_panes']==339
          assert m['v75_source_lakebridge_pier_model_count']==13
          assert m['v75_surveyed_glass_surface_count']==0 and m['v75_original_campus_GLB_untouched']
          assert m['v76_architectural_buildings']==30 and m['v76_teaching_T']==8
          assert m['v76_residential_V']==15 and m['v76_residential_D']==6 and m['v76_unique_LRC']==1
          assert m['v76_original_geometry_unchanged'] and m['v76_no_new_surveyed_windows_balconies_or_paths']
          html=(base/'双击查看_校园3D.html').read_text()
          assert all('id="embedded-'+k+'"' in html for k in ('v71','dsm','gis','contours','dsm-meta','lakefront','junctions','junction-patches','junction-meta','profile-v72','photos-v72','v74-hotspots','v75-glass','v75-atlas','v76-edges','v76-architecture'))
          assert 'cdn.jsdelivr' not in html and 'unpkg.com' not in html
          for needed in ('index.html','viewer.js','viewer.css','serve.py','启动查看器.bat',
                         'generated/BNBU_v66_SEMANTIC_Y_UP.glb',
                         'generated/BNBU_v69_WATERFRONT_REFINED.glb',
                         'generated/BNBU_v69_WATERFRONT_PROVENANCE.json',
                         'generated/BNBU_v70_LAKEFRONT_DISPLAY_OVERLAY.json',
                         'generated/BNBU_v71_CONNECTED_LAKEFRONT.glb',
                         'generated/BNBU_v71_CONNECTION_PATCHES.geojson',
                         'generated/BNBU_v71_JUNCTION_AUDIT.geojson',
                         'generated/BNBU_v71_CONNECTION_PROVENANCE.json',
                         'docs/JUNCTION_V71_AUDIT.md',
                         'generated/BNBU_v72_SOURCE_ELEVATION_PROFILES.json',
                         'evidence/connection_photos_v72.json',
                         'docs/PHOTO_CONNECTION_AUDIT_V72.md',
                         'docs/LAKEFRONT_V70_CRITICAL_COMPARISON.md',
                         'generated/BNBU_v67_OBSERVED_ALOS_DSM_SEPARATE.glb',
                         'generated/BNBU_v73_ALOS_DSM_WITH_3D_CONTOURS.glb',
                         'generated/BNBU_v73_DSM_CONTOUR_PROVENANCE.json',
                         'docs/TERRAIN_3D_V73.md',
                         'generated/BNBU_v74_ALL_ROAD_WALK_PAIRWISE.json',
                         'generated/BNBU_v74_LOCAL_3D_JUNCTION_HOTSPOTS.geojson',
                         'generated/BNBU_v74_CONNECTION_RESEARCH_SUMMARY.json',
                         'evidence/connection_comparison_sources_v74.json',
                         'docs/JUNCTIONS_V74_DEEP_COMPARISON.md',
                         'docs/BRIDGE_WINDOW_COMPONENTS_V75.md',
                         'generated/BNBU_v75_BRIDGE_COMPONENT_ATLAS.json',
                         'generated/BNBU_v75_BOARDWALK_GLASS_INFILL_DISPLAY_ONLY.glb',
                         'generated/BNBU_v76_SOURCE_SHARP_FEATURE_EDGES_DISPLAY_ONLY.glb',
                         'generated/BNBU_v76_ARCHITECTURE_COMPONENT_ATLAS.json',
                         'docs/ARCHITECTURE_V76_RECOVERY.md',
                         'source/v64/BNBU_v64_EDITABLE_GIS.gpkg'):
              assert (base/needed).is_file(),needed
          with zipfile.ZipFile('dist/BNBU_Campus_Full_v76.zip') as z:
              assert z.testzip() is None
          print('full package and standalone viewer complete:',len(m['files']),'files')
          PY
      - name: Install Chromium and Playwright for actual interface QA
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install chromium --with-deps
      - name: Browser smoke test — standalone file and local HTTP viewer, offline
        run: python campus/interface/test_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v76-browser-screenshots-and-report
          path: dist/qa/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v76-complete-offline-model-zip
          path: dist/BNBU_Campus_Full_v76.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v76-double-click-HTML
          path: dist/BNBU_Campus_Full_v76/双击查看_校园3D.html
          retention-days: 30
