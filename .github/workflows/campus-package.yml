name: BNBU v72 multi-image source-elevation connection detail and offline QA
on:
  push:
    paths:
      - "campus/interface/**"
      - "campus/build_connection_profiles_v72.py"
      - "campus/test_connection_profiles_v72.py"
      - "campus/connection_photos_v72.json"
      - "campus/PHOTO_CONNECTION_AUDIT_V72.md"
      - ".github/workflows/campus-package.yml"
  pull_request:
    paths:
      - "campus/interface/**"
      - ".github/workflows/campus-package.yml"
  workflow_dispatch:

concurrency:
  group: bnbu-v72-viewer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build fully bundled offline Three.js interface
        run: |
          npm install --prefix campus/interface --no-audit --no-fund
          npm run build --prefix campus/interface
          node --check campus/interface/dist/viewer.bundle.js
      - name: Verify v64 source and expand original complete assets
        run: |
          python campus/validate_scene.py
          python campus/unpack_assets.py
          python campus/validate_scene.py
      - name: Reproduce full v65/v66 verified geometry without source mesh changes
        run: |
          python campus/build_v65.py
          python campus/build_v66.py
          python campus/refine_waterfront_v69.py
          python -m unittest discover -s campus -p 'test_v65.py' -v
          python -m unittest discover -s campus -p 'test_v66.py' -v
          python -m unittest discover -s campus -p 'test_waterfront_v69.py' -v
      - name: Install geodetic dependency and reconstruct independent real DSM
        run: |
          python -m pip install "pyproj>=3.6,<4" "shapely>=2,<3"
          python -m unittest discover -s campus -p 'test_terrain_v67.py' -v
          python campus/build_terrain_v67.py
          python campus/build_lakefront_v70.py
          python -m unittest discover -s campus -p 'test_lakefront_v70.py' -v
          python campus/build_connection_v71.py
          python -m unittest discover -s campus -p 'test_connection_v71.py' -v
          python campus/build_connection_profiles_v72.py
          python -m unittest discover -s campus -p 'test_connection_profiles_v72.py' -v
      - name: Build audited full ZIP and zero-dependency standalone HTML
        run: |
          python campus/interface/build_package.py
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          base=Path('dist/BNBU_Campus_Full_v72')
          m=json.loads((base/'manifest.json').read_text())
          assert m['mesh_count']==1379 and m['original_mesh_count']==1377 and m['GIS_feature_count']==522
          assert m['v72_optional_source_height_rail_profiles']==4 and m['v72_observed_distinct_photo_links']==16
          assert m['standalone_file_embeds_assets']
          html=(base/'双击查看_校园3D.html').read_text()
          assert all('id="embedded-'+k+'"' in html for k in ('v71','dsm','gis','contours','dsm-meta','lakefront','junctions','junction-patches','junction-meta','profile-v72','photos-v72'))
          assert 'cdn.jsdelivr' not in html and 'unpkg.com' not in html
          for needed in ('index.html','viewer.js','viewer.css','serve.py','启动查看器.bat',
                         'generated/BNBU_v66_SEMANTIC_Y_UP.glb',
                         'generated/BNBU_v69_WATERFRONT_REFINED.glb',
                         'generated/BNBU_v69_WATERFRONT_PROVENANCE.json',
                         'generated/BNBU_v70_LAKEFRONT_DISPLAY_OVERLAY.json',
                         'generated/BNBU_v71_CONNECTED_LAKEFRONT.glb',
                         'generated/BNBU_v71_CONNECTION_PATCHES.geojson',
                         'generated/BNBU_v71_JUNCTION_AUDIT.geojson',
                         'generated/BNBU_v71_CONNECTION_PROVENANCE.json',
                         'docs/JUNCTION_V71_AUDIT.md',
                         'generated/BNBU_v72_SOURCE_ELEVATION_PROFILES.json',
                         'evidence/connection_photos_v72.json',
                         'docs/PHOTO_CONNECTION_AUDIT_V72.md',
                         'docs/LAKEFRONT_V70_CRITICAL_COMPARISON.md',
                         'generated/BNBU_v67_OBSERVED_ALOS_DSM_SEPARATE.glb',
                         'source/v64/BNBU_v64_EDITABLE_GIS.gpkg'):
              assert (base/needed).is_file(),needed
          with zipfile.ZipFile('dist/BNBU_Campus_Full_v72.zip') as z:
              assert z.testzip() is None
          print('full package and standalone viewer complete:',len(m['files']),'files')
          PY
      - name: Install Chromium and Playwright for actual interface QA
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install chromium --with-deps
      - name: Browser smoke test — standalone file and local HTTP viewer, offline
        run: python campus/interface/test_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v72-browser-screenshots-and-report
          path: dist/qa/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v72-complete-offline-model-zip
          path: dist/BNBU_Campus_Full_v72.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v72-double-click-HTML
          path: dist/BNBU_Campus_Full_v72/双击查看_校园3D.html
          retention-days: 30
