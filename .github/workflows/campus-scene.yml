name: BNBU campus scene integrity
on:
  push:
    paths:
      - 'campus/**'
      - '.github/workflows/campus-scene.yml'
  pull_request:
    paths:
      - 'campus/**'
      - '.github/workflows/campus-scene.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify compressed campus scene and evidence layers
        run: python campus/validate_scene.py
      - name: Unpack true GIS and GLB assets
        run: python campus/unpack_assets.py
      - name: Verify unpacked scene is identical
        run: python campus/validate_scene.py
      - name: Build coordinate-corrected v65 scene and reconcile references
        run: python campus/build_v65.py
      - name: Regression-test display scene and source provenance
        run: python -m unittest discover -s campus -p 'test_v65.py' -v
      - name: Build v66 semantic GLB and repair old GIS model-node references
        run: python campus/build_v66.py
      - name: Verify all 1377 meshes remain unchanged and all 102 historical GIS links resolve
        run: python -m unittest discover -s campus -p 'test_v66.py' -v
      - name: Check HTML viewer module syntax and generated-asset links
        run: python campus/test_viewer_v66.py
      - uses: actions/upload-artifact@v4
        with:
          name: BNBU-v64-source-v66-layered-scene-and-viewer
          path: |
            campus/assets/BNBU_v64_ACTIVE.glb
            campus/assets/BNBU_v64_EDITABLE_GIS.gpkg
            campus/assets/BNBU_v64_ACTIVE.geojson
            campus/assets/BNBU_v64_ACTIVE.kml
            campus/generated/BNBU_v65_DISPLAY_Y_UP.glb
            campus/generated/BNBU_v65_RENDER_REFERENCES.geojson
            campus/generated/v65_integrity_manifest.json
            campus/generated/BNBU_v66_SEMANTIC_Y_UP.glb
            campus/generated/BNBU_v66_RESOLVED_REFERENCES.geojson
            campus/generated/v66_provenance.json
            campus/viewer.html
            campus/README.md
          retention-days: 30
