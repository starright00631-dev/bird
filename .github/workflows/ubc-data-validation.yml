name: UBC pinned source audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_ubc_sources.py"
      - "tests/test_audit_ubc_sources.py"
      - "tests/test_inspect_ubc_codebook.py"
      - "scripts/inspect_ubc_codebook.py"
      - "scripts/inspect_zulian_appendix.py"
      - "scripts/build_ubc_facade_panel.py"
      - "scripts/fit_ubc_facade_glmm.R"
      - "scripts/summarize_ubc_lobo_uncertainty.py"
      - "tests/test_ubc_lobo_uncertainty.py"
      - "tests/test_ubc_facade_panel.py"
      - "tests/test_inspect_zulian_appendix.py"
      - "requirements.txt"
      - "README.md"
      - "docs/UBC_DATA_AUDIT.md"
      - "docs/COORDINATION_LOG.md"
      - "docs/PROJECT_STATUS_BIRDCOLLISION.md"
      - "docs/SOURCE_REGISTER.csv"
      - "docs/EXPERIMENT_LEDGER.csv"
      - "docs/data_registry.csv"
      - "data/raw/ubc/**"
      - ".github/workflows/ubc-data-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit_ubc_sources.py"
      - "tests/test_audit_ubc_sources.py"
      - "tests/test_inspect_ubc_codebook.py"
      - "scripts/inspect_ubc_codebook.py"
      - "scripts/inspect_zulian_appendix.py"
      - "scripts/build_ubc_facade_panel.py"
      - "scripts/fit_ubc_facade_glmm.R"
      - "tests/test_ubc_facade_panel.py"
      - "tests/test_inspect_zulian_appendix.py"
      - "requirements.txt"
      - "README.md"
      - "docs/UBC_DATA_AUDIT.md"
      - "docs/COORDINATION_LOG.md"
      - "docs/PROJECT_STATUS_BIRDCOLLISION.md"
      - "docs/SOURCE_REGISTER.csv"
      - "docs/EXPERIMENT_LEDGER.csv"
      - "docs/data_registry.csv"
      - "data/raw/ubc/**"
      - ".github/workflows/ubc-data-validation.yml"
  workflow_dispatch:

concurrency:
  group: ubc-data-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install codebook reader and test runner
        run: python -m pip install pytest openpyxl
      - name: Download and checksum-verify all De Groot source files
        run: python scripts/audit_ubc_sources.py --fetch --data-dir data/derived/ubc --out data/derived/ubc/ubc_audit.json
      - name: Inspect the READ.ME codebook without inferring column mappings
        run: python scripts/inspect_ubc_codebook.py --input data/derived/ubc/READ.ME.xlsx --out data/derived/ubc/codebook_inspection.json
      - name: Download and inspect the separate Zulian 2023 facade covariate appendix
        run: python scripts/inspect_zulian_appendix.py --download --strict --de-groot-collision-csv data/derived/ubc/Observed.Collision.Counts.csv --csv-out data/derived/ubc/zulian_appendix1.csv --report-out data/derived/ubc/zulian_appendix_inspection.json
      - name: Assert source completeness, codebook structure and observation-process schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/derived/ubc/ubc_audit.json").read_text())
          assert report["files_missing"] == []
          assert len(report["files_present"]) == 6
          assert report["search_efficiency"]["rows"] == 29
          assert report["search_efficiency"]["status"] == "repeated_detection_history_parsed"
          assert report["carcass_persistence"]["rows"] == 103
          assert report["carcass_persistence"]["status"] == "interval_and_right_censoring_fields_detected"
          assert report["carcass_persistence"]["interval_censored_trials"] == 85
          assert report["carcass_persistence"]["right_censored_trials"] == 18
          assert report["carcass_persistence"]["first_absent_inf_trials"] == 18
          assert report["carcass_persistence"]["invalid_or_incomplete_trials"] == 0
          observed = report["observed_collision_counts"]
          assert observed["raw_rows"] == 8846
          assert observed["unique_facades"] == 57
          assert observed["unique_survey_dates"] == 155
          assert observed["unique_facade_date_visits"] == 8831
          assert observed["collision_event_count"] == 152
          assert observed["positive_facade_date_visits"] == 142
          assert observed["missing_facade_date_keys_vs_full_cross_product"] == 4
          assert observed["duplicate_facade_date_groups"] == 15
          assert observed["method_schedule_mismatch_rows"] == 0
          schedule = report["search_schedule"]
          assert schedule["unique_survey_dates"] == 155
          assert schedule["period_count"] == 5
          assert schedule["monitoring_days_total_inclusive"] == 225
          assert schedule["all_buildings_searched_on_every_scheduled_date"]
          points = report["point_counts"]
          assert points["species_rows"] == 303
          assert points["checklist_groups"] == 86
          assert points["study_building_checklists"] == 72
          assert points["nonstudy_checklists"] == 14
          assert points["checklist_group_size_mismatches"] == 0
          assert points["metadata_inconsistencies"] == 0
          appendix = json.loads(Path("data/derived/ubc/zulian_appendix_inspection.json").read_text())
          assert appendix["row_count"] == 8835
          assert appendix["column_count"] == 45
          assert appendix["source"]["sha256_matches_pin"] is True
          assert appendix["panel"]["buildings"] == 8
          assert appendix["panel"]["facades"] == 57
          assert appendix["panel"]["survey_dates"] == 155
          assert appendix["panel"]["facade_date_rows"] == 8835
          assert appendix["panel"]["duplicate_facade_date_keys"] == 0
          assert appendix["panel"]["complete_facade_date_grid"] is True
          assert appendix["outcomes"]["COLLISIONMORTALITY_X"]["sum"] == 152
          assert appendix["outcomes"]["COLLISIONMORTALITY_X"]["positive_rows"] == 142
          assert appendix["outcomes"]["COLLISIONS_X"]["sum"] == 199
          assert appendix["method_counts"] == {"1": 4845, "2": 3990}
          reconciliation = appendix["cross_source_reconciliation"]
          assert reconciliation["row_join_allowed"] is False
          assert reconciliation["facade_key_sets_equal"] is True
          assert reconciliation["shared_dates"] == 139
          assert reconciliation["appendix_only_dates"] == 16
          assert reconciliation["de_groot_only_dates"] == 16
          assert reconciliation["common_facade_date_keys"] == 7919
          assert reconciliation["appendix_only_facade_date_keys"] == 916
          assert reconciliation["de_groot_only_facade_date_keys"] == 912
          assert reconciliation["mortality_count_mismatches_on_common_keys"] == 8
          assert reconciliation["method_mismatches_on_common_keys"] == 171
          assert appendix["season_counts"] == {"fall": 1881, "spring": 1881, "summer": 1881, "winter": 3192}
          codebook = json.loads(Path("data/derived/ubc/codebook_inspection.json").read_text())
          assert codebook["sheet_count"] > 0
          assert any(sheet["preview_rows"] for sheet in codebook["sheets"])
          print("UBC_CODEBOOK", json.dumps(codebook, ensure_ascii=False))
          print("ZULIAN_APPENDIX_PANEL_AUDIT", json.dumps(appendix, ensure_ascii=False))
          print("UBC_SOURCES_VERIFIED", report["files_present"])
          print("UBC_SEARCH_EFFICIENCY", report["search_efficiency"]["conditional_detection_by_search"])
          print("UBC_CARCASS_PERSISTENCE", report["carcass_persistence"])
          print("UBC_OBSERVED_COLLISION_AUDIT", report["observed_collision_counts"])
          print("UBC_SEARCH_SCHEDULE_AUDIT", report["search_schedule"])
          print("UBC_POINT_COUNT_AUDIT", report["point_counts"])
          PY
      - name: Build the canonical 8,835-row facade-date model panel
        run: python scripts/build_ubc_facade_panel.py --input data/derived/ubc/zulian_appendix1.csv --panel-out data/derived/ubc/ubc_facade_survey_panel.csv --audit-out data/derived/ubc/ubc_facade_panel_audit.json

      - name: Run UBC audit and panel-builder unit tests
        run: python -m pytest -q tests/test_audit_ubc_sources.py tests/test_inspect_ubc_codebook.py tests/test_inspect_zulian_appendix.py tests/test_ubc_facade_panel.py

      - name: Set up R for the paper-aligned seasonal GLMM
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install R model dependencies
        run: Rscript -e 'install.packages(c("glmmTMB", "DHARMa", "jsonlite"))'

      - name: Fit seasonal binomial mixed models and transfer checks
        run: Rscript scripts/fit_ubc_facade_glmm.R --input data/derived/ubc/ubc_facade_survey_panel.csv --audit data/derived/ubc/ubc_facade_panel_audit.json --out-dir results/ubc

      - name: Assert seasonal model outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          report = json.loads(Path("results/ubc/ubc_seasonal_model_run.json").read_text())
          panel_audit = json.loads(Path("data/derived/ubc/ubc_facade_panel_audit.json").read_text())
          assert report["source"]["sha256"] == panel_audit["source_sha256"]
          assert report["source"]["sha256_pinned"] is True
          assert report["model"]["primary_outcome"] == "mortality_present = 1(COLLISIONMORTALITY_X > 0)"
          assert set(report["model"]["seasonal_fits"]) == {"fall", "winter", "spring", "summer"}
          with Path("results/ubc/ubc_seasonal_model_selection.csv").open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 16, f"Expected 4 candidate models x 4 seasons, got {len(rows)}"
          expected_n = {"fall": 1881, "winter": 3192, "spring": 1881, "summer": 1881}
          expected_df = {"full": "8", "building_only": "6", "vegetation_only": "5", "null": "2"}
          for row in rows:
              assert row["n"] == str(expected_n[row["season"]])
              assert row["k"] == expected_df[row["model"]]
          assert rows, "No seasonal model-selection rows"
          for season in ("fall", "winter", "spring", "summer"):
              season_rows = [r for r in rows if r["season"] == season]
              assert any(r["converged"].lower() == "true" and r["AICc"] for r in season_rows), f"No converged model for {season}"
          lobo_path = Path("results/ubc/ubc_leave_one_building_out_validation.csv")
          assert lobo_path.exists()
          with lobo_path.open(newline="") as handle:
              lobo_rows = list(csv.DictReader(handle))
          assert len(lobo_rows) == 32, f"Expected 4 seasons x 8 held-out buildings, got {len(lobo_rows)}"
          assert all(r["baseline_converged"].lower() == "true" for r in lobo_rows), "Exposure-only holdout baseline failed"
          assert all(r["brier_skill_vs_exposure_baseline"] != "" for r in lobo_rows)
          assert all(r["log_loss_skill_vs_exposure_baseline"] != "" for r in lobo_rows)
          with Path("results/ubc/ubc_leave_one_building_out_summary.csv").open(newline="") as handle:
              lobo_summary = list(csv.DictReader(handle))
          assert len(lobo_summary) == 4, f"Expected four seasonal LOBO summaries, got {len(lobo_summary)}"
          for row in lobo_summary:
              assert row["evaluated_building_folds"] == "8"
              assert row["test_visits"] == str(expected_n[row["season"]])
              assert row["delta_brier"] != ""
              assert row["delta_log_loss"] != ""
          assert Path("results/ubc/ubc_facade_feature_correlations.csv").exists()
          assert Path("results/ubc/ubc_facade_feature_vif.csv").exists()
          with Path("results/ubc/ubc_seasonal_response_curves.csv").open(newline="") as handle:
              curves = list(csv.DictReader(handle))
          assert curves, "No conditional response curves"
          plausible_models = {
              (r["season"], r["model"])
              for r in rows
              if r["delta_AICc"] and float(r["delta_AICc"]) <= 2.0
          }
          assert all((r["season"], r["model"]) in plausible_models for r in curves), "A response curve was emitted for a model outside delta AICc <= 2"
          for curve in curves:
              if curve["predicted_probability"]:
                  p = float(curve["predicted_probability"])
                  assert 0.0 <= p <= 1.0
          print("UBC_SEASONAL_MODEL_SELECTION", rows)
          print("UBC_SEASONAL_RESPONSE_CURVES", curves[:12])
          print("UBC_LEAVE_ONE_BUILDING_OUT", lobo_rows)
          print("UBC_LEAVE_ONE_BUILDING_OUT_SUMMARY", lobo_summary)
          print("UBC_MODEL_LIMITATIONS", report["limitations"])
          PY

      - name: Paired held-out-building uncertainty (CPU only)
        run: |
          python scripts/summarize_ubc_lobo_uncertainty.py --input results/ubc/ubc_leave_one_building_out_validation.csv --output results/ubc/ubc_lobo_cluster_uncertainty.json --resamples 5000 --seed 20261117
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/ubc/ubc_lobo_cluster_uncertainty.json").read_text())
          rows = report["results"]
          assert len(rows) == 10
          assert all(r["n_held_out_buildings"] == 8 and r["n_cluster_resamples"] == 5000 for r in rows)
          assert next(r for r in rows if r["stratum"] == "overall" and r["metric"] == "brier")["n_test_visits"] == 8835
          print("UBC_CLUSTER_UNCERTAINTY", json.dumps(rows))
          PY
      - name: Upload verified De Groot source snapshot and audit report
        uses: actions/upload-artifact@v4
        with:
          name: ubc-de-groot-verified-source-snapshot
          path: |
            data/derived/ubc/
            results/ubc/
          if-no-files-found: error
          retention-days: 30
