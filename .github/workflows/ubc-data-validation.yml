name: UBC pinned source audit

on:
  pull_request:
    paths:
      - "scripts/audit_ubc_sources.py"
      - "tests/test_audit_ubc_sources.py"
      - "tests/test_inspect_ubc_codebook.py"
      - "scripts/inspect_ubc_codebook.py"
      - "requirements.txt"
      - "README.md"
      - "docs/UBC_DATA_AUDIT.md"
      - "docs/COORDINATION_LOG.md"
      - "data/raw/ubc/**"
      - ".github/workflows/ubc-data-validation.yml"
  push:
    paths:
      - "scripts/audit_ubc_sources.py"
      - "tests/test_audit_ubc_sources.py"
      - "tests/test_inspect_ubc_codebook.py"
      - "scripts/inspect_ubc_codebook.py"
      - "requirements.txt"
      - "README.md"
      - "docs/UBC_DATA_AUDIT.md"
      - "docs/COORDINATION_LOG.md"
      - "data/raw/ubc/**"
      - ".github/workflows/ubc-data-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install codebook reader and test runner
        run: python -m pip install pytest openpyxl scipy
      - name: Download and checksum-verify all De Groot source files
        run: python scripts/audit_ubc_sources.py --fetch --data-dir data/derived/ubc --out data/derived/ubc/ubc_audit.json
      - name: Inspect the READ.ME codebook without inferring column mappings
        run: python scripts/inspect_ubc_codebook.py --input data/derived/ubc/READ.ME.xlsx --out data/derived/ubc/codebook_inspection.json
      - name: Fit source-specific searcher-efficiency and carcass-persistence sensitivity
        run: python scripts/fit_ubc_observation_process.py --data-dir data/derived/ubc --out data/derived/ubc/observation_process_fit.json
      - name: Assert source completeness, codebook structure and observation-process schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/derived/ubc/ubc_audit.json").read_text())
          assert report["files_missing"] == []
          assert len(report["files_present"]) == 6
          assert report["search_efficiency"]["rows"] == 29
          assert report["search_efficiency"]["status"] == "repeated_detection_history_parsed"
          assert report["carcass_persistence"]["rows"] == 103
          assert report["carcass_persistence"]["status"] == "interval_censoring_fields_detected"
          codebook = json.loads(Path("data/derived/ubc/codebook_inspection.json").read_text())
          assert codebook["sheet_count"] > 0
          assert any(sheet["preview_rows"] for sheet in codebook["sheets"])
          observation = json.loads(Path("data/derived/ubc/observation_process_fit.json").read_text())
          assert observation["not_a_bnbu_calibration"] is True
          assert observation["search_efficiency"]["n_trials"] == 29
          assert observation["search_efficiency"]["per_search"][0]["observed_attempts"] == 29
          assert observation["search_efficiency"]["per_search"][0]["detections"] == 16
          assert observation["carcass_persistence"]["n_trials"] == 103
          assert len(observation["carcass_persistence"]["candidate_fits"]) == 4
          assert len(observation["detection_sensitivity"]) == 4
          for candidate in observation["detection_sensitivity"]:
              for method in ("1", "2"):
                  q = candidate["by_method"][method]["detection_probability_at_posterior_mean"]
                  assert 0.0 < q <= 1.0
          print("UBC_CODEBOOK", json.dumps(codebook, ensure_ascii=False))
          print("UBC_OBSERVATION_PROCESS", json.dumps(observation, ensure_ascii=False))
          print("UBC_SOURCES_VERIFIED", report["files_present"])
          print("UBC_SEARCH_EFFICIENCY", report["search_efficiency"]["conditional_detection_by_search"])
          print("UBC_CARCASS_PERSISTENCE", report["carcass_persistence"])
          PY
      - name: Run UBC audit unit tests
        run: python -m pytest -q tests/test_audit_ubc_sources.py tests/test_inspect_ubc_codebook.py
