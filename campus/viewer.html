<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNBU v66 3D / GIS evidence viewer</title><style>body{margin:0;background:#0b1728;color:#e2e8f0;font:14px system-ui}main{position:absolute;inset:0}aside{position:absolute;top:12px;left:12px;width:330px;max-width:calc(100vw - 55px);max-height:calc(100vh - 24px);overflow-y:auto;background:#111827ee;padding:16px;border-radius:12px;box-shadow:0 8px 30px #0008}label{display:block;margin:10px 0}small{color:#f9c872;line-height:1.6}button{padding:6px}p{line-height:1.5}canvas{display:block}</style></head><body><main id="view"></main><aside><b>BNBU 校园 · v66 语义分层 3D</b><p>保留 v64 全部 1377 个原有网格；v66 按实际物理类型重组层级，并恢复遗留 GIS 引用。鼠标旋转、缩放或平移。</p><p><button data-focus="all">全景</button> <button data-focus="phase1">一期</button> <button data-focus="phase2">二期</button> <button data-focus="cc">CTV/CC 周边</button></p><p><button data-focus="water_unsurveyed">湖面</button> <button data-focus="terrain_unsurveyed">山体</button> <button data-focus="vehicle_roads_unsurveyed">车行道</button> <button data-focus="elevated_boardwalk_unsurveyed">临水廊道</button></p><label><input type="checkbox" data-part="terrain_unsurveyed" checked> 山体（非 DEM）</label><label><input type="checkbox" data-part="water_unsurveyed" checked> 湖面（非测绘）</label><label><input type="checkbox" data-part="shore_unsurveyed" checked> 岸坡（非测绘）</label><label><input type="checkbox" data-part="vehicle_roads_unsurveyed" checked> 车行道路（非实测）</label><label><input type="checkbox" data-part="pedestrian_paving_unsurveyed" checked> 步行道路 / 铺装</label><label><input type="checkbox" data-part="ground_connectors_unsurveyed" checked> 地面连接（不是桥）</label><label><input type="checkbox" data-part="elevated_boardwalk_unsurveyed" checked> 临水廊道 / 支柱</label><label><input type="checkbox" data-part="stairs_unsurveyed" checked> 楼梯</label><label><input type="checkbox" data-part="glass_proxies_unregistered" checked> 玻璃候选面（未配准）</label><label><input type="checkbox" data-part="architecture_opaque" checked> 建筑与实体墙</label><button id="reset">重置视角</button><p><a href="./terrain_reference.html" target="_blank" rel="noopener">山体：ALOS 遥感 DSM 对照（独立 3D 视图，标高不得与建筑直接叠加）</a></p><p id="selection" style="font-size:11px;color:#abdaee">点击某个三维网格，可查看已有 GIS 证据记录。</p><p><a target="_blank" rel="noopener" href="https://www.bnbu.edu.cn/en/images/shouhuiditu2025.jpg">官方手绘校园图</a> · <a target="_blank" rel="noopener" href="https://www.4dmodel.com/UICcode/code/#/list">全景影像入口</a> · <a target="_blank" rel="noopener" href="https://bnbu.edu.cn/info/1075/115659.htm">山体实景</a></p><p id="status">正在加载 GLB…</p><small>CTV 附近小建筑及邻接车道未经正射或多视角配准；“校长别墅”名称未证实，不加入正式场景。六处二期地面连接段不是高架桥。模型不得用作实测地形或鸟撞玻璃面积。</small></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const host=document.getElementById('view'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc6dae5);const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,50000),r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(2,devicePixelRatio));host.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));const lamp=new THREE.DirectionalLight(0xffffff,2);lamp.position.set(300,700,450);scene.add(lamp);const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;let obj=null,c0,t0;function group(o){let p=o.parent;while(p){if(p.userData?.layer)return p.userData.layer;if(p.name?.startsWith("BNBU_GROUP_"))return p.name.slice(11).toLowerCase();p=p.parent;}return 'architecture_opaque'}function focusPart(name){if(!obj)return;const b=new THREE.Box3(),pos=new THREE.Vector3();let count=0;obj.traverse(o=>{if(!o.isMesh)return;let ok=false;if(name==='all')ok=true;else if(name==='phase1'||name==='phase2'){new THREE.Box3().setFromObject(o).getCenter(pos);ok=(name==='phase2')===(pos.z < -500)}else if(name==='cc')ok=/(^MAIN_CC$|^ROOF_(DECK|PARAPET)_CC$|STORYEDGE_CC_)/i.test(o.name);else ok=o.userData.part===name;if(ok){b.expandByObject(o);count++}});if(!count)return;const ctr=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3()),dist=Math.max(35,size.length()*1.45);orbit.target.copy(ctr);cam.position.copy(ctr).add(new THREE.Vector3(dist*.65,dist*.82,dist*.74));cam.near=Math.max(.02,dist/30000);cam.far=Math.max(5000,dist*35);cam.updateProjectionMatrix();orbit.update()}document.querySelectorAll('[data-focus]').forEach(btn=>btn.onclick=()=>focusPart(btn.dataset.focus));const evidenceByNode=new Map();fetch('./generated/BNBU_v66_RESOLVED_REFERENCES.geojson').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(g=>{for(const f of g.features){const n=f.properties?.render_model_node;if(n){const a=evidenceByNode.get(n)||[];a.push(f.properties);evidenceByNode.set(n,a)}}}).catch(()=>{});const picker=new THREE.Raycaster(),mouse=new THREE.Vector2();r.domElement.addEventListener('click',ev=>{if(!obj)return;const rect=r.domElement.getBoundingClientRect();mouse.set((ev.clientX-rect.left)/rect.width*2-1,-(ev.clientY-rect.top)/rect.height*2+1);picker.setFromCamera(mouse,cam);const hits=picker.intersectObjects(obj.children,true).filter(h=>h.object.isMesh&&h.object.visible&&h.object.parent?.visible);if(!hits.length)return;const m=hits[0].object,refs=evidenceByNode.get(m.name)||[],p=refs[0]||{};document.getElementById('selection').textContent='网格：'+m.name+'｜类型：'+m.userData.part+'｜GIS 对应：'+refs.length+' 条｜证据：'+(p.source||'现有模型网格，待影像配准')+'｜可信度：'+(p.confidence||'未测绘')});function apply(){if(!obj)return;const vis=Object.fromEntries([...document.querySelectorAll('[data-part]')].map(e=>[e.dataset.part,e.checked]));obj.traverse(o=>{if(o.isMesh)o.visible=vis[o.userData.part]})}document.querySelectorAll('[data-part]').forEach(el=>el.onchange=apply);new GLTFLoader().load('./generated/BNBU_v66_SEMANTIC_Y_UP.glb',g=>{obj=g.scene;obj.traverse(o=>{if(o.isMesh)o.userData.part=group(o)});scene.add(obj);const b=new THREE.Box3().setFromObject(obj),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());orbit.target.copy(center);cam.position.copy(center).add(new THREE.Vector3(size.x*.85,Math.max(size.y,size.z)*1.8,size.z*.85));cam.near=Math.max(.05,size.length()/100000);cam.far=Math.max(5000,size.length()*20);cam.updateProjectionMatrix();orbit.update();c0=cam.position.clone();t0=center.clone();apply();let n=0;obj.traverse(o=>{if(o.isMesh)n++});status.textContent='已载入 '+n+' 个网格节点。按实体场景层级分组；非实测。'},e=>{if(e.total)status.textContent='载入 '+Math.round(100*e.loaded/e.total)+'%'},e=>status.textContent='载入失败：请先运行 python campus/build_v66.py，再执行 python -m http.server 8000。 '+e.message);document.getElementById('reset').onclick=()=>{if(c0){cam.position.copy(c0);orbit.target.copy(t0);orbit.update()}};onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};(function loop(){requestAnimationFrame(loop);orbit.update();r.render(scene,cam)})()</script></body></html>
