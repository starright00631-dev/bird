<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNBU v64 3D campus</title><style>body{margin:0;background:#0b1728;color:#e2e8f0;font:14px system-ui}main{position:absolute;inset:0}aside{position:absolute;top:12px;left:12px;width:300px;max-width:calc(100vw - 55px);background:#111827ee;padding:16px;border-radius:12px;box-shadow:0 8px 30px #0008}label{display:block;margin:10px 0}small{color:#f9c872;line-height:1.6}button{padding:6px}p{line-height:1.5}canvas{display:block}</style></head><body><main id="view"></main><aside><b>BNBU 校园 · v64 3D</b><p>保留此前完整场景，切换不同要素查看。鼠标旋转、缩放或平移。</p><label><input type="checkbox" data-part="terrain" checked> 山体（非 DEM）</label><label><input type="checkbox" data-part="water" checked> 湖泊、岸线（非测绘）</label><label><input type="checkbox" data-part="road" checked> 道路与铺装</label><label><input type="checkbox" data-part="other" checked> 建筑及其余结构</label><button id="reset">重置视角</button><p id="status">正在加载 GLB…</p><small>CTV 小建筑没有经过独立影像定位，已隔离；湖岸、山体、道路及玻璃尺寸均未达到实测标准。本场景不得直接用作定量鸟撞结论。</small></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const host=document.getElementById('view'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc6dae5);const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,50000),r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(2,devicePixelRatio));host.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));const lamp=new THREE.DirectionalLight(0xffffff,2);lamp.position.set(300,700,450);scene.add(lamp);const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;let obj=null,c0,t0;function group(n){n=n.toUpperCase();if(/TERRAIN_RELIEF|NORTH_RIDGE|ARTS_HILL|WOODLAND_SLOPE|WEST_HILL/.test(n))return 'terrain';if(/LAKE_|SHORE_|WATER_|LAKE_BANK|LAKE00/.test(n))return 'water';if(/ROAD_|PAVING_|FOOTPATH|WALK_|PEDESTRIAN/.test(n))return 'road';return 'other'}function apply(){if(!obj)return;const vis=Object.fromEntries([...document.querySelectorAll('[data-part]')].map(e=>[e.dataset.part,e.checked]));obj.traverse(o=>{if(o.isMesh)o.visible=vis[o.userData.part]})}document.querySelectorAll('[data-part]').forEach(el=>el.onchange=apply);new GLTFLoader().load('./assets/BNBU_v64_ACTIVE.glb',g=>{obj=g.scene;obj.traverse(o=>{if(o.isMesh)o.userData.part=group(o.name||o.parent?.name||'')});scene.add(obj);const b=new THREE.Box3().setFromObject(obj),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());orbit.target.copy(center);cam.position.copy(center).add(new THREE.Vector3(size.x*.85,Math.max(size.y,size.z)*1.8,size.z*.85));cam.near=Math.max(.05,size.length()/100000);cam.far=Math.max(5000,size.length()*20);cam.updateProjectionMatrix();orbit.update();c0=cam.position.clone();t0=center.clone();apply();let n=0;obj.traverse(o=>{if(o.isMesh)n++});status.textContent='已载入 '+n+' 个网格节点。类别按网格名称识别；非实测。'},e=>{if(e.total)status.textContent='载入 '+Math.round(100*e.loaded/e.total)+'%'},e=>status.textContent='载入失败：请先运行 python campus/unpack_assets.py，再执行 python -m http.server 8000。 '+e.message);document.getElementById('reset').onclick=()=>{if(c0){cam.position.copy(c0);orbit.target.copy(t0);orbit.update()}};onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};(function loop(){requestAnimationFrame(loop);orbit.update();r.render(scene,cam)})()</script></body></html>
